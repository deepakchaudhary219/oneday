# Same Flyway migrations as production, on H2 in MySQL mode.
spring.datasource.url=jdbc:h2:mem:oneday;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

oneday.security.jwt-secret=test-jwt-secret-0123456789abcdef0123456789
oneday.location.jitter-secret=test-location-secret-0123456789abcdef0123
oneday.verification.provider=dev
oneday.media.provider=dev
oneday.registration.per-ip-per-hour=10000
oneday.signals.daily-budget=3
oneday.discovery.heat-k-anonymity=2
oneday.discovery.queries-per-hour=1000
# Tests move the clock forward by days; keep tokens valid across those jumps.
oneday.security.token-ttl=P30D
