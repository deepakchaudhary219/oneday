# Same Flyway migrations as production, on H2 in MySQL mode.
spring.datasource.url=jdbc:h2:mem:oneday;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

oneday.security.jwt-secret=test-jwt-secret-0123456789abcdef0123456789
oneday.location.jitter-secret=test-location-secret-0123456789abcdef0123
oneday.verification.provider=dev
oneday.media.provider=dev
oneday.media.async-processing=false
oneday.sms.provider=dev
oneday.push.provider=dev
# Tests drive the Local Pulse job directly with the controllable clock.
oneday.pulse.cron=-
oneday.otp.per-ip-per-hour=1000
oneday.registration.per-ip-per-hour=10000
oneday.signals.daily-budget=3
oneday.discovery.heat-k-anonymity=2
oneday.discovery.queries-per-hour=1000
# Tests move the clock forward by days; keep tokens valid across those jumps.
oneday.security.token-ttl=P30D
oneday.security.refresh-token-ttl=P60D
oneday.security.logins-per-ip-per-hour=10000
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
oneday.grievance.officer-name=Test Grievance Officer
oneday.grievance.officer-email=grievance@oneday.test
# Tests deliver outbox events explicitly (OutboxRelay.drain) so they stay deterministic.
oneday.events.relay-initial-delay=P1D
# Tests drive Date Mode's clock (DateService steps) directly.
oneday.dates.sweep-initial-delay=P1D
oneday.reverification.initial-delay=P1D
# Tests always get the wellbeing question (when not recently answered) and report any number of answers.
oneday.wellbeing.ask-percent=100
oneday.wellbeing.min-answers-to-report=2
oneday.moments.purge-initial-delay=P1D
oneday.right-now.enabled=true
# Each test checks sign-out and suspension immediately; caching is covered by its own test.
oneday.security.session-cache-ttl=PT0S
oneday.plans.sweep-initial-delay=P1D
oneday.attestation.provider=dev
oneday.plus.provider=dev
oneday.plus.razorpay.webhook-secret=test-webhook-secret
# Existing tests use the full radius; the Plus test narrows the free tier itself.
oneday.plus.free-max-radius-km=15
