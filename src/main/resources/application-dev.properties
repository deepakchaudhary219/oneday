# Local development profile: SPRING_PROFILES_ACTIVE=dev
# These secrets are for local use only. Real deployments must set ONEDAY_JWT_SECRET and ONEDAY_LOCATION_SECRET.
oneday.security.jwt-secret=dev-only-jwt-secret-change-me-0123456789abcdef
oneday.location.jitter-secret=dev-only-location-secret-change-me-0123456789
oneday.verification.provider=dev
oneday.media.provider=dev
oneday.sms.provider=dev
oneday.push.provider=dev
oneday.discovery.heat-k-anonymity=2
spring.jpa.show-sql=true
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
oneday.attestation.provider=dev
oneday.plus.provider=dev
