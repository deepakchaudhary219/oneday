# Multi-replica deployments: SPRING_PROFILES_ACTIVE=prod,redis
# Rate limits and location probe budgets are shared through Redis so they hold across replicas.
oneday.state.store=redis
spring.data.redis.host=${ONEDAY_REDIS_HOST:localhost}
spring.data.redis.port=${ONEDAY_REDIS_PORT:6379}
spring.data.redis.password=${ONEDAY_REDIS_PASSWORD:}
management.health.redis.enabled=true
