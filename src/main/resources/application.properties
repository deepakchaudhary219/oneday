spring.application.name=oneday

# --- Relational core (MySQL 8). Override via environment in every non-local deployment. ---
spring.datasource.url=${ONEDAY_DB_URL:jdbc:mysql://localhost:3306/oneday?createDatabaseIfNotExist=true}
spring.datasource.username=${ONEDAY_DB_USER:root}
spring.datasource.password=${ONEDAY_DB_PASSWORD:root}

# Flyway owns the schema (src/main/resources/db/migration); Hibernate never alters it.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.enabled=true

management.endpoints.web.exposure.include=health,info,prometheus
# Metrics: run with MANAGEMENT_SERVER_PORT=8081 (a port that is never exposed publicly) and Prometheus scrapes
# /actuator/prometheus there without a token. On the public port the endpoint needs an admin token.
# Every log line of a request carries its X-Request-Id.
logging.pattern.correlation=[%X{requestId:-}]\u0020
# Redis health is switched on by the 'redis' profile, the only mode that uses Redis.
management.health.redis.enabled=false
# API docs are a development aid; a deployment publishes them only with ONEDAY_API_DOCS=true.
springdoc.api-docs.enabled=${ONEDAY_API_DOCS:false}
springdoc.swagger-ui.enabled=${ONEDAY_API_DOCS:false}

# --- Shared state for rate limits / probe budgets: 'memory' (single node) or 'redis' (multi-replica). ---
oneday.state.store=${ONEDAY_STATE_STORE:memory}

# --- Security: secrets have no defaults; the app refuses to start without them. ---
oneday.security.jwt-secret=${ONEDAY_JWT_SECRET:}
# Access tokens are short-lived; the app renews them with a rotating refresh token (see SessionService).
oneday.security.token-ttl=PT15M
oneday.security.refresh-token-ttl=P30D
oneday.security.session-max-age=P180D
oneday.security.refresh-reuse-grace=PT30S
oneday.security.max-sessions=10
# The per-request session check is cached this long; every session end evicts it at once (on all replicas
# with the redis profile), so the TTL only bounds a lost eviction.
oneday.security.session-cache-ttl=PT15S

# Optional read replica (opt-in reads only, see oneday.platform.ReplicaReads). Unset: everything uses the primary.
# oneday.datasource.replica.jdbc-url=jdbc:mysql://replica:3306/oneday
# oneday.datasource.replica.username=...
# oneday.datasource.replica.password=...
oneday.security.logins-per-account-per-hour=10
oneday.security.logins-per-ip-per-hour=100

# --- Domain events: transactional outbox relayed to in-process consumers (at least once, idempotent) ---
oneday.events.batch-size=50
oneday.events.lease=PT30S
oneday.events.max-attempts=10
oneday.events.retention=P7D
# 'in-process' (default: the relay calls the handlers directly) or 'kafka' (see application-kafka.properties).
oneday.events.transport=${ONEDAY_EVENTS_TRANSPORT:in-process}
oneday.events.kafka.topic=oneday.domain-events
oneday.events.kafka.group=oneday
oneday.events.kafka.partitions=12
oneday.events.kafka.replicas=1
oneday.events.kafka.concurrency=3

# --- Date Mode (blueprint v2 section 5.3): time-boxed exact location, trusted contact, check-ins, SOS ---
oneday.dates.max-advance=P30D
oneday.dates.min-duration=PT30M
oneday.dates.max-duration=PT8H
oneday.dates.location-lead=PT30M
oneday.dates.location-freshness=PT10M
oneday.dates.check-in-after=PT1H
oneday.dates.check-in-grace=PT15M
oneday.dates.after-care-window=PT2H
oneday.dates.escalation-retention=P7D
oneday.dates.emergency-number=112
oneday.dates.default-country-code=+91
# Base of the private link texted to a trusted contact (the public HTTPS address of this API).
oneday.dates.public-base-url=${ONEDAY_PUBLIC_URL:http://localhost:8080}

# --- Signup ---
oneday.registration.per-ip-per-hour=20
oneday.registration.current-consent-version=2026-09

# --- Phone OTP login ('dev' logs codes locally; production needs a DLT-registered SMS adapter) ---
oneday.sms.provider=${ONEDAY_SMS_PROVIDER:none}
oneday.otp.ttl=PT5M
oneday.otp.max-attempts=5
oneday.otp.per-phone-limit=3
oneday.otp.per-phone-window=PT15M
oneday.otp.per-ip-per-hour=10
oneday.otp.default-country-code=+91

# --- Vendor adapters (all optional; dev stand-ins are used in the dev profile) ---
# Google service account (JSON key file) shared by FCM push and Play Integrity.
# oneday.google.credentials-file=/run/secrets/google-service-account.json
# FCM push: ONEDAY_PUSH_PROVIDER=fcm (needs the credentials file above).
# MSG91 DLT SMS: ONEDAY_SMS_PROVIDER=msg91 plus a DLT-registered template id per message type.
oneday.sms.msg91.auth-key=${ONEDAY_MSG91_AUTH_KEY:}
oneday.sms.msg91.templates.OTP=${ONEDAY_MSG91_TEMPLATE_OTP:}
oneday.sms.msg91.templates.TRUSTED_CONTACT=${ONEDAY_MSG91_TEMPLATE_TRUSTED_CONTACT:}
oneday.sms.msg91.templates.SAFETY_ALERT=${ONEDAY_MSG91_TEMPLATE_SAFETY_ALERT:}
# Device attestation on signup and location updates: off | monitor | enforce. Provider: dev or play-integrity.
oneday.attestation.mode=${ONEDAY_ATTESTATION_MODE:off}
oneday.attestation.provider=${ONEDAY_ATTESTATION_PROVIDER:none}
oneday.attestation.android-package=${ONEDAY_ANDROID_PACKAGE:app.oneday}

# --- Push notifications ('dev' logs pushes; production needs an FCM/APNs adapter) ---
oneday.push.provider=${ONEDAY_PUSH_PROVIDER:none}
# How often due Local Pulses are checked (each user still gets at most one per local day, at their hour).
oneday.pulse.cron=0 */10 * * * *

# --- Verification: 'none' until a vendor adapter is configured (never auto-approves by default). ---
oneday.verification.provider=${ONEDAY_VERIFICATION_PROVIDER:none}
oneday.verification.auto-approve-confidence=0.85
oneday.verification.max-age-gap-years=8

# Re-verification (blueprint section 21.4): checks lapse after 90 days, with one reminder a week before.
oneday.reverification.validity=P90D
oneday.reverification.reminder-before=P7D

# --- Location privacy & anti-spoofing (tech arch v2 section 5) ---
oneday.location.jitter-secret=${ONEDAY_LOCATION_SECRET:}
oneday.location.min-update-interval=PT30S
oneday.location.max-speed-kmh=1000
oneday.location.max-distinct-cells-per-hour=12

# --- Content ---
oneday.moments.ttl=PT24H
# Expired story rows (and their capture cell) are deleted this long after expiry; held accounts keep theirs.
oneday.moments.retention-after-expiry=P14D

# --- Grievance Officer (IT Rules 3(2), DPDP): published in the app and on the website. Required before launch. ---
oneday.grievance.officer-name=${ONEDAY_GRIEVANCE_OFFICER_NAME:}
oneday.grievance.officer-email=${ONEDAY_GRIEVANCE_OFFICER_EMAIL:}
oneday.grievance.officer-address=${ONEDAY_GRIEVANCE_OFFICER_ADDRESS:}
oneday.grievance.per-user-per-day=5

# --- Media storage: 's3' (AWS S3 / MinIO), 'dev' (fake URLs) or 'none'. Use an Indian region for residency. ---
# Set a bucket lifecycle rule expiring moments/ after ~3 days: stories are ephemeral (see README).
oneday.media.provider=${ONEDAY_MEDIA_PROVIDER:none}
oneday.media.bucket=${ONEDAY_MEDIA_BUCKET:oneday-media}
oneday.media.region=${ONEDAY_MEDIA_REGION:ap-south-1}
oneday.media.endpoint=${ONEDAY_MEDIA_ENDPOINT:}
# Host in signed URLs, when phones reach the store differently from this service (e.g. inside Docker).
oneday.media.public-endpoint=${ONEDAY_MEDIA_PUBLIC_ENDPOINT:}
oneday.media.access-key=${ONEDAY_MEDIA_ACCESS_KEY:}
oneday.media.secret-key=${ONEDAY_MEDIA_SECRET_KEY:}
oneday.media.upload-ttl=PT10M
oneday.media.view-ttl=PT1H
oneday.media.max-photo-bytes=15728640
oneday.media.max-video-bytes=104857600
oneday.media.uploads-per-hour=30
# Processing worker: photos are re-encoded in-process; videos need ffmpeg/ffprobe on the worker image.
oneday.media.async-processing=true
oneday.media.max-photo-pixels=40000000
oneday.media.max-video-seconds=60
oneday.media.ffmpeg-path=${ONEDAY_FFMPEG:ffmpeg}
oneday.media.ffprobe-path=${ONEDAY_FFPROBE:ffprobe}
oneday.media.dev-base-url=${ONEDAY_DEV_MEDIA_URL:http://localhost:8080/dev-media/}

# --- Discovery (bounded sessions, privacy thresholds) ---
oneday.discovery.batch-size=12
oneday.discovery.max-pages-per-session=3
oneday.discovery.max-radius-km=15
oneday.discovery.city-radius-km=40
oneday.discovery.queries-per-hour=60
oneday.discovery.heat-k-anonymity=10

# --- Wellbeing guardrail (docs/05 section 5): ask about 1 in 50 person-days, at most once a fortnight ---
oneday.wellbeing.ask-percent=2
oneday.wellbeing.min-gap=P14D
oneday.wellbeing.min-answers-to-report=20

# --- Right Now (blueprint v2 section 6.1): off until density Gate 2 is met in a city ---
oneday.right-now.enabled=${ONEDAY_RIGHT_NOW:false}
oneday.right-now.max-results=20

# --- Real-time delivery (STOMP over WebSocket at /ws); fan-out across replicas via Redis with the redis profile ---
oneday.realtime.allowed-origins=${ONEDAY_REALTIME_ORIGINS:*}

# --- Story Map: adaptive k-anonymous clusters (docs/05-engagement-psychology.md section 3.1) ---
oneday.map.neighbourhood-k=3
oneday.map.area-k=2
oneday.map.max-clusters=40
oneday.map.stories-per-cluster=8

# --- Trust & Safety staff console ---
# Comma-separated user ids treated as ADMIN (bootstrap the first admin; ids, not emails).
oneday.staff.bootstrap-admin-user-ids=${ONEDAY_BOOTSTRAP_ADMIN_IDS:}
# Response-time targets per report priority (P0 matches the shortest IT Rules takedown windows).
oneday.staff.sla-p0=PT2H
oneday.staff.sla-p1=PT24H
oneday.staff.sla-p2=PT72H

# --- Evidence retention (IT Rules 2021, Rule 3(1)(g)): enforced accounts' records survive erasure requests ---
oneday.safety.evidence-retention=P180D

# --- Signals: budget and Reaction Window (blueprint v2 section 4) ---
oneday.signals.daily-budget=20
oneday.signals.reaction-window=PT48H
oneday.signals.digest-batch-size=20
