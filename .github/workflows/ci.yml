name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (${{ matrix.database }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        database: [h2, mysql]
    services:
      mysql:
        # An empty image skips the service, so only the MySQL leg starts one.
        image: ${{ matrix.database == 'mysql' && 'mysql:8.4' || '' }}
        env:
          MYSQL_DATABASE: oneday_test
          MYSQL_USER: oneday
          MYSQL_PASSWORD: oneday
          MYSQL_RANDOM_ROOT_PASSWORD: "yes"
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -u oneday -poneday --silent"
          --health-interval 5s --health-timeout 5s --health-retries 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      # Video processing tests need ffmpeg/ffprobe; the Redis state-store tests start their own redis-server.
      - name: Install ffmpeg and redis-server
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends ffmpeg redis-server

      - name: Point the tests at MySQL
        if: matrix.database == 'mysql'
        run: |
          echo "SPRING_DATASOURCE_URL=jdbc:mysql://127.0.0.1:3306/oneday_test" >> "$GITHUB_ENV"
          echo "SPRING_DATASOURCE_USERNAME=oneday" >> "$GITHUB_ENV"
          echo "SPRING_DATASOURCE_PASSWORD=oneday" >> "$GITHUB_ENV"

      - name: Test
        run: ./mvnw -B verify

      # Tests skip themselves when ffmpeg or redis-server is missing; in CI that would hide real coverage.
      - name: Fail on skipped tests
        run: |
          if grep -l 'skipped="[1-9]' target/surefire-reports/TEST-*.xml; then
            echo "::error::Some tests were skipped; CI must run all of them"
            exit 1
          fi

      - name: Keep test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports-${{ matrix.database }}
          path: target/surefire-reports/
          retention-days: 7

  image:
    name: Container image + stack smoke test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      # The same three commands the README gives developers, so that path can't rot.
      - name: Throwaway secrets for the stack
        run: scripts/new-env.sh

      - name: Build and start the stack
        run: docker compose up --build --detach --wait --wait-timeout 300

      - name: Smoke test (in its own container)
        run: docker compose run --rm smoke

      - name: Stack logs
        if: failure()
        run: docker compose logs --no-color

      - name: Stop the stack
        if: always()
        run: docker compose down --volumes
